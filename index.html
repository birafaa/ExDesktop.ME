<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="exDesktop — модифицированный кроссплатформенный клиент Telegram для компьютера. Версия 7.3.3.(5)."
    />
    <meta name="theme-color" content="#FFF8F6" />
    <title>exDesktop</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem("exdesktop-color-scheme")
          var mode =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
          var root = document.documentElement
          root.dataset.theme = mode
          root.style.colorScheme = mode
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute("content", mode === "dark" ? "#1A1110" : "#FFF8F6")
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Для просмотра сайта нужен JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
